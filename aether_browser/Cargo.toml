[package]
name = "aether-browser"
version = "0.1.0"
edition = "2021"
description = "AetherOS Headless Semantic Web Browser — converts web pages to conversational audio streams"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.21"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[lib]
name = "aether_browser"
path = "src/lib.rs"
