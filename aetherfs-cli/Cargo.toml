[package]
name = "aetherfs-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
aetherfs-proto = { path = "../aetherfs-proto" }
tokio = { version = "1.37", features = ["full"] }
tonic = "0.11"
clap = { version = "4.5.4", features = ["derive"] }
uuid = { version = "1.8.0", features = ["v4"] }
tokio-stream = "0.1.15"
tower = "0.4.13"


