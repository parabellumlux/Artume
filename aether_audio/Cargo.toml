[package]
name = "aether-audio"
version = "0.1.0"
edition = "2021"
description = "AetherOS Spatial Audio Engine — PipeWire HRTF spatial mixer & context stack"

[dependencies]
libc = "0.2"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
dasp = { version = "0.11", features = ["signal"] }
# PipeWire FFI — raw C bindings via pkg-config
pipewire = "0.10"
# PipeWire SPA bindings for audio format definitions
pipewire-native-spa = "0.1"
# Wake word detection
oww-rs = "0.3"
cpal = "0.17"
audio_tools = "0.3"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
approx = "0.5"
float-cmp = "0.9"

[lib]
name = "aether_audio"
path = "src/lib.rs"
