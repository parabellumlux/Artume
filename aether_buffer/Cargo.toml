[package]
name = "aether-buffer"
version = "0.1.0"
edition = "2021"
description = "AetherOS Audio Context Buffer (Scratchpad) — rolling transcript ring buffer & NER entity resolver"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[lib]
name = "aether_buffer"
path = "src/lib.rs"
