[package]
name = "aether-attention"
version = "0.1.0"
edition = "2021"
description = "AetherOS Intelligent Attention Manager — cognitive load governor & notification scheduler"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "aether_attention"
path = "src/lib.rs"
