[package]
name = "aether-orchestrator"
version = "0.1.0"
edition = "2021"
description = "AetherOS Conversational Orchestrator — Ollama-backed AI pipeline with dual-GPU routing"

[features]
default = ["ollama"]
# Ollama HTTP API backend (default — no native CUDA deps needed)
ollama = []
# Speech-to-text via whisper.cpp (optional)
stt = ["whisper-rs"]
# Text-to-speech via any-tts (optional)
tts = ["any-tts"]

[dependencies]
# Ollama HTTP API client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Speech-to-text via whisper.cpp (feature-gated)
whisper-rs = { version = "0.16", optional = true }

# Text-to-speech via any-tts (feature-gated)
any-tts = { version = "0.1", default-features = false, features = ["kokoro", "download"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Audio I/O
hound = "3"
cpal = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# gRPC client for aetherfs-core
tonic = "0.11"
tower = "0.4"

# AetherOS crates
aether-browser = { path = "../aether_browser" }
aether-buffer = { path = "../aether_buffer" }
aether-audio = { path = "../aether_audio" }
aether-attention = { path = "../aether_attention" }
aetherfs-proto = { path = "../aetherfs-proto" }

[lib]
name = "aether_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "aether-shell"
path = "src/bin/shell.rs"
