[package]
name = "aether-orchestrator"
version = "0.1.0"
edition = "2021"
description = "AetherOS Conversational Orchestrator — local CPU model ensemble for STT, intent routing, LLM conversation, and TTS"

[features]
default = ["llm"]
# LLM inference via llama.cpp (core — always on by default)
llm = ["llama-cpp-2", "encoding_rs"]
# Speech-to-text via whisper.cpp (optional — ggml conflict with llama)
stt = ["whisper-rs"]
# Text-to-speech via any-tts (optional — Candle-based, no ggml conflict)
tts = ["any-tts"]

[dependencies]
# LLM inference via llama.cpp (feature-gated)
llama-cpp-2 = { version = "0.1", optional = true }

# Speech-to-text via whisper.cpp (feature-gated)
whisper-rs = { version = "0.16", optional = true }

# Text-to-speech via any-tts (feature-gated)
any-tts = { version = "0.1", default-features = false, features = ["kokoro", "download"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio I/O
hound = "3"
cpal = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
parking_lot = "0.12"
chrono = "0.4"
encoding_rs = { version = "0.8", optional = true }

[lib]
name = "aether_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "aether-shell"
path = "src/bin/shell.rs"
