[package]
name = "aether-ide"
version = "0.1.0"
edition = "2021"
description = "AetherOS Audio-First IDE — tree-sitter parsing, code sonification, LSP/DAP client"

[dependencies]
# Tree-sitter for incremental parsing
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml = "0.20"
tree-sitter-yaml = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

# JSON-RPC for IPC with Python UI
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LSP client
lsp-types = "0.97"
tower-lsp = "0.20"

# DAP client
dap = "0.4.1-alpha1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
parking_lot = "0.12"

# File system watching
notify = "6"

# AetherOS crates
aether-audio = { path = "../aether_audio" }

[lib]
name = "aether_ide"
path = "src/lib.rs"

[[bin]]
name = "aether-ide-daemon"
path = "src/bin/daemon.rs"

[dev-dependencies]
tempfile = "3"
